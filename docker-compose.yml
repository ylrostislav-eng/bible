services:
  postgres:
    image: postgres:16-alpine
    container_name: bible-quiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bible_quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bible_quiz}
      POSTGRES_DB: ${POSTGRES_DB:-bible_quiz}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
